<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenpoint Av Subway Arrivals</title>
    <script src="https://unpkg.com/protobufjs/dist/protobuf.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        font-family: "Soehne", "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at 30% 20%, #f5f7ff, #f7fafc 30%), #f7fafc;
        color: #0f172a;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      .app {
        max-width: 820px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 2.2rem;
        margin: 4px 0;
      }
      .eyebrow {
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 0.85rem;
        color: #4f46e5;
        font-weight: 700;
      }
      .sub {
        margin: 0;
        color: #475569;
      }
      button {
        border: 1px solid #cbd5e1;
        background: #0f172a;
        color: #f8fafc;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: transform 150ms ease, box-shadow 150ms ease;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
      }
      button:hover {
        transform: translateY(-1px);
      }
      .status {
        margin: 24px 0 8px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #eef2ff;
        color: #312e81;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .lists {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
      }
      .card h2 {
        margin: 0 0 10px;
        font-size: 1.1rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .arrival {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #e2e8f0;
      }
      .arrival:last-child {
        border-bottom: none;
      }
      .route {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #16a34a;
        color: white;
        font-weight: 700;
        font-size: 0.95rem;
      }
      .time {
        color: #0f172a;
        font-weight: 600;
      }
      .meta {
        font-size: 0.9rem;
        color: #475569;
      }
      .error {
        background: #fef2f2;
        color: #991b1b;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <p class="eyebrow">🚇 Greenpoint Av</p>
          <h1>Live G train arrivals</h1>
          <p class="sub">Filters GTFS-RT feed for stop ID prefix G22</p>
        </div>
        <button id="refresh">Refresh</button>
      </header>
      <section id="status" class="status">Loading…</section>
      <section id="lists" class="lists"></section>
    </main>

    <script>
      // Minimal inline GTFS-RT proto (official spec)
      const GTFS_RT_PROTO = `
        syntax = "proto2";
        package transit_realtime;
        option java_package = "com.google.transit.realtime";
        option java_outer_classname = "GtfsRealtime";
        message FeedMessage {
          required FeedHeader header = 1;
          repeated FeedEntity entity = 2;
        }
        message FeedHeader {
          required string gtfs_realtime_version = 1;
          optional Incrementality incrementality = 2 [default = FULL_DATASET];
          optional uint64 timestamp = 3;
          enum Incrementality {
            FULL_DATASET = 0;
            DIFFERENTIAL = 1;
          }
        }
        message FeedEntity {
          required string id = 1;
          optional bool is_deleted = 2 [default = false];
          optional TripUpdate trip_update = 3;
          optional VehiclePosition vehicle = 4;
          optional Alert alert = 5;
        }
        message TripUpdate {
          message StopTimeEvent {
            optional int32 delay = 1;
            optional int64 time = 2;
            optional int32 uncertainty = 3;
          }
          message StopTimeUpdate {
            enum ScheduleRelationship {
              SCHEDULED = 0;
              SKIPPED = 1;
              NO_DATA = 2;
              UNSCHEDULED = 3;
            }
            optional uint32 stop_sequence = 1;
            optional string stop_id = 4;
            optional StopTimeEvent arrival = 2;
            optional StopTimeEvent departure = 3;
            optional ScheduleRelationship schedule_relationship = 5;
          }
          message TripDescriptor {
            enum ScheduleRelationship {
              SCHEDULED = 0;
              ADDED = 1;
              UNSCHEDULED = 2;
              CANCELED = 3;
              REPLACEMENT = 5;
              DUPLICATED = 6;
            }
            optional string trip_id = 1;
            optional string route_id = 5;
            optional uint32 direction_id = 6;
            optional string start_time = 2;
            optional string start_date = 3;
            optional string schedule_relationship = 4;
          }
          optional TripDescriptor trip = 1;
          optional VehicleDescriptor vehicle = 3;
          repeated StopTimeUpdate stop_time_update = 2;
          optional uint64 timestamp = 4;
          optional int32 delay = 5;
        }
        message VehiclePosition {
          message Position {
            optional float latitude = 1;
            optional float longitude = 2;
            optional float bearing = 3;
            optional double odometer = 4;
            optional float speed = 5;
          }
          enum CongestionLevel {
            UNKNOWN_CONGESTION_LEVEL = 0;
            RUNNING_SMOOTHLY = 1;
            STOP_AND_GO = 2;
            CONGESTION = 3;
            SEVERE_CONGESTION = 4;
          }
          enum OccupancyStatus {
            EMPTY = 0;
            MANY_SEATS_AVAILABLE = 1;
            FEW_SEATS_AVAILABLE = 2;
            STANDING_ROOM_ONLY = 3;
            CRUSHED_STANDING_ROOM_ONLY = 4;
            FULL = 5;
            NOT_ACCEPTING_PASSENGERS = 6;
          }
          optional TripUpdate.TripDescriptor trip = 1;
          optional VehicleDescriptor vehicle = 8;
          optional Position position = 2;
          optional uint64 current_stop_sequence = 3;
          optional string stop_id = 7;
          enum VehicleStopStatus {
            INCOMING_AT = 0;
            STOPPED_AT = 1;
            IN_TRANSIT_TO = 2;
          }
          optional VehicleStopStatus current_status = 4 [default = IN_TRANSIT_TO];
          optional uint64 timestamp = 5;
          optional CongestionLevel congestion_level = 6;
          optional OccupancyStatus occupancy_status = 9;
        }
        message Alert {
          message TimeRange {
            optional uint64 start = 1;
            optional uint64 end = 2;
          }
          message EntitySelector {
            optional string agency_id = 1;
            optional string route_id = 2;
            optional string route_type = 3;
            optional TripUpdate.TripDescriptor trip = 4;
            optional string stop_id = 5;
          }
          message TranslatedString {
            message Translation {
              optional string text = 1;
              optional string language = 2;
            }
            repeated Translation translation = 1;
          }
          optional TranslatedString cause = 6;
          optional TranslatedString effect = 7;
          repeated TimeRange active_period = 1;
          repeated EntitySelector informed_entity = 5;
          optional TranslatedString url = 8;
          optional TranslatedString header_text = 10;
          optional TranslatedString description_text = 11;
        }
        message VehicleDescriptor {
          optional string id = 1;
          optional string label = 2;
          optional string license_plate = 3;
        }
      `;
    </script>

    <script>
      const FEED_URL =
        "https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/nyct%2Fgtfs-g";
      const GREENPOINT_STOP_ID_PREFIX = "G22";

      const statusEl = document.querySelector("#status");
      const listsEl = document.querySelector("#lists");
      const refreshBtn = document.querySelector("#refresh");

      const root = protobuf.parse(GTFS_RT_PROTO).root;
      const FeedMessage = root.lookupType("transit_realtime.FeedMessage");

      const toInt = (val) => {
        if (typeof val === "number") return val;
        if (typeof val === "bigint") return Number(val);
        if (val && typeof val === "object" && "toNumber" in val) {
          try {
            return val.toNumber();
          } catch {
            return undefined;
          }
        }
        return undefined;
      };

      const formatRelative = (target) => {
        const now = new Date();
        const diffMin = Math.round((target - now) / 60000);
        if (diffMin <= 0) return "due";
        if (diffMin === 1) return "in 1 min";
        if (diffMin < 60) return `in ${diffMin} min`;
        const h = Math.floor(diffMin / 60);
        const m = diffMin % 60;
        return m === 0 ? `in ${h}h` : `in ${h}h ${m}m`;
      };

      const headway = (curr, next) => {
        if (!next) return "";
        const diffMin = Math.round((next.time - curr.time) / 60000);
        return diffMin > 0 ? ` • next in ${diffMin}m` : "";
      };

      const parseFeed = (feed) => {
        const now = new Date();
        const north = [];
        const south = [];
        const other = [];

        const headerTs = toInt(feed.header?.timestamp ?? undefined) ?? null;
        const ageText = headerTs
          ? formatRelative(new Date(headerTs * 1000)).replace("in ", "") + " ago"
          : "unknown";

        for (const entity of feed.entity ?? []) {
          const tu = entity.trip_update ?? entity.tripUpdate ?? entity.tripupdate;
          const tripUpdate = tu || entity.tripUpdate;
          if (!tripUpdate) continue;

          const trip = tripUpdate.trip;
          const route = trip?.route_id ?? trip?.routeId ?? "?";
          const baseDir = (() => {
            const d =
              toInt(trip?.direction_id) ??
              toInt(trip?.directionId) ??
              toInt(trip?.directionid);
            if (d === 0) return "Northbound";
            if (d === 1) return "Southbound";
            return "Other";
          })();

          for (const stu of tripUpdate.stop_time_update ?? tripUpdate.stopTimeUpdate ?? []) {
            const stopId = stu.stop_id ?? stu.stopId;
            if (!stopId || !stopId.startsWith(GREENPOINT_STOP_ID_PREFIX)) continue;

            const rawTs = toInt(stu.arrival?.time) ?? toInt(stu.departure?.time);
            if (!rawTs) continue;

            const when = new Date(rawTs * 1000);
            if (when < now) continue;

            const dir = (() => {
              const last = stopId.at(-1);
              if (last === "N") return "Northbound";
              if (last === "S") return "Southbound";
              return baseDir;
            })();

            const target = dir === "Northbound" ? north : dir === "Southbound" ? south : other;
            target.push({ time: when, route, dir });
          }
        }

        const sorter = (a, b) => a.time - b.time;
        north.sort(sorter);
        south.sort(sorter);
        other.sort(sorter);

        return { north, south, other, ageText };
      };

      const render = (groups) => {
        const total = groups.north.length + groups.south.length + groups.other.length;
        statusEl.className = "status";
        statusEl.textContent =
          total === 0
            ? "No arrivals found for G22 right now."
            : `Feed age: ${groups.ageText} • Showing ${total} arrival${total === 1 ? "" : "s"}`;

        const cards = [
          { title: "Northbound", icon: "⬆️", items: groups.north.slice(0, 3) },
          { title: "Southbound", icon: "⬇️", items: groups.south.slice(0, 3) },
          { title: "Other", icon: "⬜", items: groups.other.slice(0, 3) }
        ];

        listsEl.innerHTML = cards
          .filter((c) => c.items.length)
          .map(
            (card) => `
            <article class="card">
              <h2>${card.icon} ${card.title}</h2>
              ${card.items
                .map((arrival, idx) => {
                  const next = card.items[idx + 1];
                  return `
                    <div class="arrival">
                      <div>
                        <span class="route">${arrival.route}</span>
                        <span class="meta"> ${formatRelative(arrival.time)}${headway(arrival, next)}</span>
                      </div>
                      <span class="time">${arrival.time.toLocaleTimeString([], {
                        hour: "numeric",
                        minute: "2-digit"
                      })}</span>
                    </div>
                  `;
                })
                .join("")}
            </article>
          `
          )
          .join("");

        if (!listsEl.innerHTML.trim()) {
          listsEl.innerHTML =
            '<article class="card"><p class="meta">No arrivals for G22 in the feed.</p></article>';
        }
      };

      const setError = (msg) => {
        statusEl.className = "status error";
        statusEl.textContent = msg;
        listsEl.innerHTML = "";
      };

      const load = async () => {
        try {
          statusEl.className = "status";
          statusEl.textContent = "Loading…";

          const resp = await fetch(FEED_URL, { mode: "cors" });
          if (!resp.ok) throw new Error(`Request failed: ${resp.status} ${resp.statusText}`);

          const buf = await resp.arrayBuffer();
          const feed = FeedMessage.decode(new Uint8Array(buf));
          render(parseFeed(feed));
        } catch (err) {
          setError(err instanceof Error ? err.message : "Failed to load arrivals.");
          console.error(err);
        }
      };

      refreshBtn.addEventListener("click", load);
      load();
    </script>
  </body>
</html>
