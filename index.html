<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenpoint Av Subway Arrivals</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <p class="eyebrow">🚇 <span id="stop-name"></span></p>
          <h1>Live G train arrivals</h1>
          <p class="sub">Select any station (defaults to Greenpoint Av / G26)</p>
        </div>
        <div class="controls">
          <label class="field">
            <span class="label">Station</span>
            <select id="stop-select" name="stop-select"></select>
          </label>
          <button id="refresh">Refresh</button>
        </div>
      </header>
      <section id="status" class="status">Loading…</section>
      <section id="lists" class="lists"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
